plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snappress'
    compileSdk 34

    defaultConfig {
        applicationId "com.snappress"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            def keystoreFile = file("keystore/snappress-release.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("SNAP_STORE_PASS")
                keyAlias "snappress"
                keyPassword System.getenv("SNAP_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def keystoreFile = file("keystore/snappress-release.keystore")
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
